schema_version: '0.1'
experiment_id: A7
status: approved_phase3_rework
question: >-
  Under one predeclared evaluation contract on the frozen NFHS-5 cohort, how do
  logistic regression, XGBoost and CatBoost compare on matched rows and
  validation keys across F1 and F1+facility-detail+observed-history
  representations, including calibration quality, threshold behaviour, SHAP
  family ranking and robustness checks?
wave: NFHS-5
cohort_rule: >-
  m15 in {20-27, 30-33, 96} and b19 in 0-59 and m17 in {0, 1};
  unique (caseid, bidx) asserted with hard errors (frozen C1; D2 includes m15=96)
expected_cohort:
  n_births: 201311
  n_mothers: 158429
  n_events: 44742
candidates:
  tiers: [F1, F1_detail_history]
  models: [logistic_regression, xgboost, catboost]
  shared_rows: true
  calibration:
    subset_fraction: 0.2
    seed: 4208
    group_col: caseid
    methods: [uncalibrated, platt, isotonic]
    selection: lowest_validation_brier
    tie_break: [uncalibrated, platt, isotonic]
tuning:
  tier: F1
  pool: fit_pool_after_calibration_carve
  folds: 3
  seed: 4207
  scoring: average_precision
  splitter: StratifiedGroupKFold
  logistic_regression_grid:
    - {C: 0.1, solver: liblinear, max_iter: 1000, class_weight: balanced}
    - {C: 1.0, solver: liblinear, max_iter: 1000, class_weight: balanced}
    - {C: 10.0, solver: liblinear, max_iter: 1000, class_weight: balanced}
  xgboost_grid:
    - {n_estimators: 200, max_depth: 6, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, eval_metric: logloss, tree_method: hist}
    - {n_estimators: 300, max_depth: 6, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, eval_metric: logloss, tree_method: hist}
    - {n_estimators: 200, max_depth: 4, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, eval_metric: logloss, tree_method: hist}
    - {n_estimators: 200, max_depth: 6, learning_rate: 0.10, subsample: 0.8, colsample_bytree: 0.8, eval_metric: logloss, tree_method: hist}
  catboost_grid:
    - {iterations: 300, depth: 6, learning_rate: 0.05, l2_leaf_reg: 3.0, nan_mode: Min}
    - {iterations: 300, depth: 4, learning_rate: 0.05, l2_leaf_reg: 3.0, nan_mode: Min}
    - {iterations: 300, depth: 6, learning_rate: 0.10, l2_leaf_reg: 3.0, nan_mode: Min}
thresholds:
  primary: 0.50
  threshold_basis: predeclared_conventional_not_optimized
  alternatives:
    - f1_optimal_on_validation
    - youden_on_validation
    - recall_ge_0.80_on_validation
evaluation:
  partition: validation
  test_contract: >-
    The development test partition is scored exactly once by this runner and
    labelled development-test; V1 exposure prevents independent-test claims.
shap:
  model: xgboost
  tier: F1_detail_history
  sample_size: 5000
  seed: 4209
  background: validation_rows_bounded_sample
  scale: raw_margin_output
  aggregation: families_from_fitted_encoder_categories
  stability: fold_models_and_subgroups
robustness:
  repeated_split_seeds: [7, 2026, 99]
  repeated_split_model: xgboost
  repeated_split_tiers: [F1, F1_detail_history]
  m15_96_exclusion:
    model: xgboost
    tier: F1
    partition: inherited_from_main_mother_assignment
  most_recent_birth:
    model: xgboost
    tier: F1
    one_birth_per_mother: latest_b3_bidx_by_calendar_order
  psu_overlap:
    variable: v021
    unit: sampled_psu_code_never_exported
  subgroup_min_rows: 200
  subgroup_min_class_rows: 30
  subgroups: [sector_facility_type, residence, qualifying_states_pooled]
f0_reconciliation:
  parquet_flag: --f0-parquet
  merge_keys: [respondent_id, birth_index]
  expected_rows: 201311
  model: xgboost
  params: a7_reference_config_not_v1_exact_hyperparameters
models:
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
    tree_method: hist
    scale_pos_weight: train_negatives_over_train_positives
  catboost:
    iterations: 300
    depth: 6
    learning_rate: 0.05
    l2_leaf_reg: 3.0
    nan_mode: Min
    scale_pos_weight: train_negatives_over_train_positives
  logistic_regression:
    C: 1.0
    solver: liblinear
    max_iter: 1000
    class_weight: balanced
split:
  split_id: mother_grouped_70_15_15_seed42_provisional
  group_col: caseid
  target_col: m17
  fractions: [0.7, 0.15, 0.15]
  seed: 42
  status: provisional_until_A7_freeze
disclosure:
  suppression_threshold: 10
notes:
  - >-
    Every candidate in this experiment is fitted on identical fit-pool rows and
    scored on identical validation keys; group-exclusive supervision is a hard
    error at every stage.
  - >-
    Calibrators are fitted only on the grouped calibration carve of the
    training partition (seed 4208); validation labels choose the variant, and
    the test partition is scored once.
  - >-
    SHAP values are computed in raw margin space on a bounded validation
    sample, aggregated to source feature families through the fitted encoder
    categories; ranks are compared across grouped fold models and supported
    subgroups.
  - >-
    F0 (36-feature historical model) is reconciled and fitted only if the
    processed parquet matches the frozen cohort key-for-key and label-for-key;
    its hyperparameters are the A7 reference config, not an exact V1
    reproduction.
  - >-
    Scores are point estimates without design-based confidence intervals;
    suppression threshold 10 applies to every committed output.
