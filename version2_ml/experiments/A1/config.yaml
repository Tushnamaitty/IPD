schema_version: '0.1'
experiment_id: A1
status: approved_phase1_rework
question: >-
  Do location-related features add reliable incremental predictive value to the
  retrospective eight-core F1 baseline on matched NFHS-5 births?
wave: NFHS-5
cohort_rule: >-
  m15 in {20-27, 30-33, 96} and b19 in 0-59 and m17 in {0, 1};
  unique (caseid, bidx) asserted with hard errors
expected_cohort:
  n_births: 201311
  n_mothers: 158429
split:
  split_id: mother_grouped_70_15_15_seed42_provisional
  group_col: caseid
  target_col: m17
  fractions: [0.7, 0.15, 0.15]
  seed: 42
  status: provisional_until_A7_freeze
evaluation:
  partition: validation
  threshold: 0.50
  threshold_basis: predeclared_conventional_not_optimized
  test_partition: not_run_deferred_to_A7_single_frozen_evaluation
features:
  F1:
    numerical: [maternal_age_at_index_birth, education_years, wealth_index, birth_order]
    categorical: [facility_type, residence, religion, twin_order]
    builder_id: version2_ml/feature_builder.py::make_core_features
  F2:
    adds: [state_ut]
    builder_id: version2_ml/experiments/A1/src/a1_state_context.py::build_state_frame
  F2_interaction:
    adds: [state_ut_x_residence]
    gate: D9 support screen applied on training rows only
support_gate:
  min_training_rows: 200
  min_class_rows: 30
disclosure:
  suppression_threshold: 10
models:
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss
    tree_method: hist
    scale_pos_weight: train_negatives_over_train_positives
  logistic_regression:
    C: 1.0
    solver: liblinear
    max_iter: 1000
    class_weight: balanced
external_area_context: []
notes:
  - >-
    No time-valid external area descriptor with full provenance is available;
    A1 falls back to categorical state and residence (handoff section 5).
  - >-
    Residence is already part of the eight-core F1, so "F1 plus state and
    residence" equals F1 + state_ut.
  - >-
    State codes are never treated as numeric ordinals; one-hot encoding is
    fitted on training rows only with handle_unknown=ignore.
  - >-
    Interaction cells contain state labels; outputs apply <10 small-cell
    suppression.
  - >-
    Logistic regression uses the library-default L2 penalty; the deprecated
    explicit penalty argument is omitted under scikit-learn 1.9.1 and the
    default is recorded in the run summary.
